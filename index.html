:block;height:100%;background:#e6b85c;border-radius:8px}.back{float:right;border:0;border-radius:9px;padding:8px 12px}.qbox{margin-top:15px}.qbox h3{font-size:19px;line-height:1.45}.option{width:100%;text-align:left;background:white;border:1px solid #dfe5ee;border-radius:12px;padding:12px;margin:5px 0;display:flex;gap:10px;line-height:1.4}.option b{background:#edf0f5;border-radius:7px;padding:3px 7px}.option.sel{border:2px solid #172b50;background:#f0f3fa}.actions{display:flex;gap:7px;margin:13px 0}.actions button{flex:1;padding:11px;border:0;border-radius:10px;background:#e9edf4}.actions .cta{background:#142344;color:white}.result{text-align:center;margin-bottom:15px}.result b{display:block;font-size:38px;margin:5px}.review{margin:10px 0}.review>small{font-weight:800}.review p{font-size:13px;line-height:1.45}.good{color:#13764e;font-weight:750}.bad{color:#b22e3e;font-weight:750}.skip{color:#946200;font-weight:750}.entry{margin:9px 0;display:grid;grid-template-columns:1fr auto;gap:4px}.entry small{grid-column:1/3}.entry button{justify-self:start;border:0;border-radius:8px;padding:8px;background:#edf0f6}.chart{height:145px;display:flex;align-items:end;gap:9px;background:white;padding:16px;border-radius:14px}.chart div{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:5px}.chart i{width:70%;background:#e6bd69;border-radius:5px 5px 0 0;min-height:3px}.chart small{font-size:10px}@media(max-width:390px){.topics{grid-template-columns:1fr}.actions button{font-size:12px;padding:9px}}

const BANK={"History": [["Mature Harappan urbanism is best identified by which combination?", ["Iron tools and horse chariots", "Standardised weights and planned drainage", "Punch-marked coins and temples", "Large stone stupas"], 1, "Standardised weights, planned streets and drainage characterise mature Harappan cities."], ["Dholavira is especially noted for:", ["Dockyard", "Water reservoirs and water management", "Ashokan pillars", "Iron furnaces"], 1, "Dholavira is famous for reservoirs and water-harvesting; Lothal is traditionally linked to a dockyard."], ["In the Rigvedic economy, an important measure of wealth was:", ["Land revenue", "Cattle", "Silver coinage", "Maritime trade"], 1, "Cattle were central to wealth, status and exchange in the Rigvedic world."], ["Gahapati in early Buddhist texts generally meant:", ["Royal priest", "Householder or landholder", "Monk", "Military commander"], 1, "Gahapati usually referred to a householder, often a prosperous landholder."], ["Rajagriha was an early capital of:", ["Kosala", "Avanti", "Magadha", "Vatsa"], 2, "Rajagriha was an early Magadhan capital before Pataliputra rose to prominence."], ["The Second Buddhist Council is traditionally associated with:", ["Rajagriha", "Vaishali", "Pataliputra", "Kashmir"], 1, "The Second Council is traditionally located at Vaishali."], ["The Barabar caves were donated to the Ajivikas during the Mauryan period by:", ["Ashoka and Dasharatha", "Chandragupta II", "Kanishka", "Harsha"], 0, "Ashoka and his grandson Dasharatha are associated with cave dedications to Ajivikas."], ["The Arthashastra is traditionally attributed to:", ["Banabhatta", "Kalidasa", "Kautilya", "Kalhana"], 2, "The Arthashastra is traditionally attributed to Kautilya/Chanakya."], ["Ashoka's Dhamma is best understood as:", ["Buddhist monastic law", "Broad ethical code promoting moral conduct and tolerance", "Compulsory conversion policy", "Rejection of all other faiths"], 1, "Dhamma stressed compassion, respect, toleran Ambedkar", "Nehru and Jinnah", "Tilak and Besant"], 1, "The pact replaced separate electorates for the Depressed Classes with reserved seats in joint electorates."], ["The Bihar famine of 1873–74 is notable for:", ["Being post-independence", "Extensive relief including grain imports", "Causing the 1857 revolt", "Causing Permanent Settlement"], 1, "The colonial administration undertook substantial relief, including rice imports from Burma."]], "Science & Technology": [["Moving a satellite from a lower to a higher circular orbit causes:", ["Speed and period both rise", "Speed falls; period rises", "Speed rises; period falls", "Both fall"], 1, "Orbital speed falls with radius; orbital period increases."], ["In a forward-biased p-n junction:", ["Depletion layer widens", "Barrier rises", "Depletion layer narrows", "Current cannot flow"], 2, "Forward bias reduces the potential barrier and narrows the depletion region."], ["The photoelectric effect demonstrates the:", ["Wave nature of electrons", "Particle nature of light", "Magnetic nature of photons", "Conservation of charge only"], 1, "The effect shows light transfers energy in discrete photons."], ["A transformer works on:", ["Electrostatic induction", "Mutual induction", "Photoelectric effect", "Thermionic emission"], 1, "Changing magnetic flux in the primary induces emf in the secondary."], ["A nuclear reactor moderator is used to:", ["Absorb all neutrons", "Slow fast neutrons", "Speed neutrons up", "Absorb gamma rays"], 1, "Slower neutrons are more likely to induce fission in suitable thermal reactor fuels."], ["A nuclide has an 8-year half-life. Fraction remaining after 24 years:", ["1/2", "1/4", "1/8", "1/16"], 2, "Three half-lives have elapsed; (1/2)^3 = 1/8 remains."], ["A buffer solution resists changes in:", ["Temperature", "Pressure", "pH", "Volume"], 2, "A buffer resists modest pH changes when small amounts of acid or base are added."], ["A catalyst generally:", ["Raises equilibrium constant", "Lowers activation energy", "Changes reaction enthalpy", "Changes equilibrium composition"], 1, "A catalyst lowers activation energy but does not change equilibrium constant."], ["Which carbon allotrope has conducting layered sheets?", ["Diamond", "Graphite", "Fullerene", "Lonsdaleite"], 1, "Graphite has delocalised electrons within layered carbon sheets."], ["Stainless steel resists corrosion mainly due to:", ["Nickel evaporation", "Chromium oxide passive film", "Pure iron coating", "High carbon"], 1, "Chromium forms a protective oxide film."], ["Green hydrogen is generally produced by:", ["Coal gasification", "Electrolysis with renewable electricity", "Petroleum refining", "Natural gas combustion"], 1, "Green hydrogen uses renewable electricity to split water."], ["In CRISPR-Cas9, guide RNA:", ["Repairs DNA", "Directs Cas9 to target DNA", "Creates amino acids", "Copies chromosomes"], 1, "Guide RNA matches a target sequence and directs Cas9 to it."], ["During translation, tRNA:", ["Carries code from nucleus", "Brings amino acids to ribosome", "Replicates DNA", "Breaks proteins"], 1, "tRNA matches anticodons to mRNA codons and delivers amino acids."], ["Naturally acquired passive immunity includes:", ["Immunity after infection", "Maternal antibodies via placenta", "Vaccination", "Memory B cells"], 1, "Maternal IgG crosses the placenta and provides passive immunity."], ["Which organelle modifies and packages proteins?", ["Lysosome", "Golgi apparatus", "Centriole", "Nucleolus"], 1, "The Golgi apparatus modifies, sorts and packages proteins."], ["mRNA vaccines primarily:", ["Permanently change DNA", "Provide instructions to produce an antigen", "Inject antibodies", "Contain live pathogen"], 1, "Cells temporarily use mRNA to make an antigen that stimulates immunity."], ["Which is NOT a stem-cell characteristic?", ["Self-renewal", "Differentiation potential", "Absence of cell division", "Regenerative potential"], 2, "Stem cells can divide, self-renew and differentiate."], ["Aditya-L1 studies:", ["Moon", "Sun", "Mars", "Venus"], 1, "Aditya-L1 is India's solar observation mission."], ["The Sun-Earth L1 region is useful because it:", ["Is inside Sun", "Offers relatively uninterrupted solar view", "Has zero gravity", "Is on Earth's surface"], 1, "L1 provides a relatively continuous view of the Sun; it is not a zero-gravity point."], ["NavIC is:", ["NASA global system", "India's regional satellite navigation system", "Human spaceflight mission", "Weather satellite"], 1, "NavIC provides regional positioning and timing services."], ["Fusion releases energy when:", ["Heavy nuclei split", "Light nuclei form a more tightly bound nucleus", "Electrons become neutrons", "Atoms lose electrons"], 1, "The mass difference between reactants and product is released as energy."], ["RADAR detects objects using:", ["Sound waves", "Radio waves", "UV rays", "Visible light"], 1, "RADAR transmits radio waves and detects their reflections."], ["Quantum entanglement refers to:", ["Data compression", "Non-classical correlations between quantum systems", "Processor cooling", "Bit conversion"], 1, "Entangled systems have joint states that cannot be described as independent states."], ["Blockchain is best described as:", ["Centralised spreadsheet", "Distributed linked ledger", "Antivirus", "Satellite protocol"], 1, "Blockchain stores linked records across network participants, commonly secured cryptographically."], ["A limitation of generative AI is:", ["Cannot process language", "Can generate plausible but incorrect information", "Cannot identify patterns", "Cannot process images"], 1, "Generative AI may hallucinate fluent but false information."], ["5G network slicing enables:", ["Virtual networks on shared infrastructure", "Zero latency", "Only satellite links", "Physical device separation"], 0, "Network slicing creates logically separate virtual networks on shared infrastructure."], ["Edge computing means:", ["Processing data near its source", "Only distant data-centre processing", "Larger processors", "Only optical fibre"], 0, "Processing near the data source can reduce latency and backhaul traffic."], ["Reverse osmosis desalination uses:", ["Freezing", "Pressure across semipermeable membrane", "Chlorination", "Sedimentation alone"], 1, "Pressure drives water through a membrane that rejects much of the dissolved salt."], ["Bioremediation uses:", ["Microorganisms to reduce pollutants", "Radioactive waste", "Mechanical filtration only", "Combustion"], 0, "Microbes or other biological processes degrade, transform or immobilise pollutants."], ["Carbon capture and storage involves:", ["Turning all CO2 into oxygen", "Capturing and storing CO2 to prevent release", "Removing nitrogen", "Making hydrogen"], 1, "CCS captures carbon dioxide and stores it, often in geological formations."]]};
const $=s=>document.querySelector(s), root=$("#app"),KEY="lakshya-bpsc-v1";
let state=JSON.parse(localStorage.getItem(KEY)||'{"name":"","tests":[],"active":null}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(state)), letters="ABCD";
function frame(title,sub,body,tab="Home"){root.innerHTML=`<header><div class="logo">LAKSHYA <b>BPSC</b></div><small>AI-ASSISTED PREPARATION</small><h1>${title}</h1><p>${sub}</p></header><main>${body}</main><nav>${["Home","Practice","Progress","History"].map(x=>`<button class="${tab===x?"on":""}" onclick="go('${x}')">${x}</button>`).join("")}</nav>`}
function login(){root.innerHTML=`<main class="login"><div class="panel"><div class="logo">LAKSHYA <b>BPSC</b></div><h1>Your daily preparation starts here.</h1><p>30 challenging MCQs. Detailed review. Progress that stays on this device.</p><input id="name" placeholder="Your name" maxlength="32"><button class="cta" onclick="enter()">Start practice</button><small>Local profile only in this starter release. Cloud login is planned for a later version.</small></div></main>`}
function enter(){let n=$("#name").value.trim();if(!n)return alert("Enter your name");state.name=n;save();go("Home")}
function topic(t){return `<button class="topic" onclick="start('${t}')"><span>${t==="History"?"🏛️":"🧬"}</span><h3>${t}</h3><p>30 questions · Moderate–High</p></button>`}
function summary(){let tests=state.tests,correct=tests.reduce((a,x)=>a+x.c,0),attempted=tests.reduce((a,x)=>a+x.a,0),avg=tests.length?tests.reduce((a,x)=>a+x.score,0)/tests.length:0;return {n:tests.length,acc:attempted?Math.round(correct/attempted*100):0,avg:avg.toFixed(1)}}
function go(tab){if(!state.name)return login();if(tab==="Home"){let s=summary();frame(`Welcome, ${state.name}`,"One focused set a day adds up.",`<section class="stats"><div><b>${s.n}</b><small>Tests</small></div><div><b>${s.acc}%</b><small>Accuracy</small></div><div><b>${s.avg}</b><small>Average / 30</small></div></section><h2>Choose a subject</h2><div class="topics">${topic("History")}${topic("Science & Technology")}</div><p class="note">Scoring: +1 correct · −⅓ incorrect · 0 skipped. Polity, Geography, Economy and Bihar Special are planned for the next content release.</p>`);return}
if(tab==="Practice"){frame("Practice","Choose a 30-question test.",`<div class="topics">${topic("History")}${topic("Science & Technology")}</div><p class="note">Every test includes four options, negative marking and a detailed explanation after submission.</p>`,tab);return}
if(tab==="Progress"){let s=summary(),last=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=d.toLocaleDateString("en-CA");return {d:d.toLocaleDateString("en-IN",{weekday:"short"}),v:state.tests.filter(x=>x.date===key).reduce((a,x)=>a+x.score,0)}}),mx=Math.max(1,...last.map(x=>x.v));frame("Your progress","A clear view of consistency and accuracy.",`<section class="stats"><div><b>${s.n}</b><small>Tests completed</small></div><div><b>${s.acc}%</b><small>Accuracy</small></div><div><b>${s.avg}</b><small>Average score</small></div></section><h2>Last seven days · net score</h2><div class="chart">${last.map(x=>`<div><i style="height:${Math.max(4,x.v/mx*100)}px"></i><small>${x.d}</small><small>${x.v?x.v.toFixed(0):"–"}</small></div>`).join("")}</div><p class="note">Your results are stored locally in this browser. Clearing browser data or changing devices may erase or separate your progress.</p>` ,tab);return}
let rows=state.tests.slice().reverse().map(x=>`<article class="entry"><b>${x.subject}</b><strong>${x.score.toFixed(2)}/30</strong><small>${x.date} · ${x.c} correct · ${x.w} wrong · ${x.s} skipped</small><button onclick="review('${x.id}')">Open review</button></article>`).join("");frame("Test history","Review previous attempts.",rows||"<p>No completed tests yet.</p>",tab)}
function start(subject){state.active={id:String(Date.now()),subject,ans:{},i:0};save();question()}
function question(){let a=state.active,q=BANK[a.subject][a.i],n=a.i+1;root.innerHTML=`<header><button class="back" onclick="go('Practice')">Exit</button><small>${a.subject.toUpperCase()} · MODERATE–HIGH</small><h2>Question ${n} / 30</h2><div class="track"><i style="width:${n/30*100}%"></i></div></header><main><div class="qbox"><h3>${q[0]}</h3>${q[1].map((o,j)=>`<button class="option ${a.ans[a.i]===j?"sel":""}" onclick="pick(${j})"><b>${letters[j]}</b>${o}</button>`).join("")}</div><div class="actions"><button onclick="move(-1)" ${a.i===0?"disabled":""}>Previous</button><button onclick="skip()">Skip</button><button class="cta" onclick="${n===30?"finish()":"move(1)"}">${n===30?"Submit":"Next"}</button></div><small>${Object.keys(a.ans).length} answered · unanswered questions receive zero</small></main>`}
function pick(j){state.active.ans[state.active.i]=j;save();question()}
function move(d){state.active.i=Math.max(0,Math.min(29,state.active.i+d));save();question()}
function skip(){delete state.active.ans[state.active.i];if(state.active.i<29)state.active.i++;save();question()}
function finish(){let a=state.active,arr=BANK[a.subject],c=0,w=0,s=0,rev=arr.map((q,i)=>{let v=a.ans[i];if(v===undefined)s++;else if(v===q[2])c++;else w++;return {i,v:v===undefined?null:v,correct:q[2]}}),r={id:a.id,subject:a.subject,date:new Date().toLocaleDateString("en-CA"),c,w,s,a:c+w,score:c-w/3,rev};state.tests.push(r);state.active=null;save();review(r.id)}
function review(id){let r=state.tests.find(x=>x.id===id);if(!r)return;let body=`<section class="result"><small>FINAL SCORE</small><b>${r.score.toFixed(2)} / 30</b><small>${r.c} correct · ${r.w} incorrect · ${r.s} skipped</small></section>`+r.rev.map((v,k)=>{let q=BANK[r.subject][v.i],ok=v.v===v.correct,skip=v.v===null;return `<article class="review"><b>Q${k+1}. ${q[0]}</b><small class="${skip?"skip":ok?"good":"bad"}">${skip?"Skipped":ok?"Correct":"Incorrect"}</small>${q[1].map((o,j)=>`<p class="${j===v.correct?"good":v.v===j&&!ok?"bad":""}">${letters[j]}. ${o} ${j===v.correct?"✓":v.v===j&&!ok?"← Your answer":""}</p>`).join("")}<p><b>Your answer:</b> ${skip?"Skipped":letters[v.v]} · <b>Correct:</b> ${letters[v.correct]}</p><p><b>Explanation:</b> ${q[3]}</p></article>`}).join("");frame("Detailed review",r.subject+" · "+r.date,body)}
if(!state.name)login();else go("Home");
window.addEventListener("load",()=>{if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{})});
</script></body></html>
