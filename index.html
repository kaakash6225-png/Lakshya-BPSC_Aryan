.qbox{margin-top:12px}.qbox h3{font-size:18px;line-height:1.45;margin:8px 0 14px}.actions{display:flex;gap:7px;margin:13px 0}.actions button{flex:1}.track{height:6px;background:#ffffff45;border-radius:8px;margin-top:12px}.track i{display:block;height:100%;background:var(--gold);border-radius:8px}

a{color:#24569b;overflow-wrap:anywhere}.source{padding:12px 0;border-bottom:1px solid var(--line)}.source:last-child{border:0}
@media(max-width:390px){.grid{grid-template-columns:1fr}.actions button{font-size:12px;padding:9px}}

if(tab==="Mains"){let cards=MAINS.map((x,i)=>`<article class="listitem"><div class="row"><b>${x.name}</b><span class="tag gold">Answer practice</span></div><p class="muted">${x.detail}</p><button class="outline" onclick="writeAnswer(${i})">Open writing workspace</button></article>`).join("");frame("Mains preparation","Build structured answers, essays and revision notes.",`<div class="note">Use the latest BPSC notification to confirm paper-wise syllabus, marks, word limits and qualifying rules. This workspace is for practice, not an official evaluation.</div><div class="panel">${cards}</div>`,"Mains");return}
if(tab==="Sources"){let items=SOURCES.map(x=>`<div class="source"><div class="row"><b>${x.name}</b><span class="tag">${x.kind}</span></div><p class="muted">${x.why}</p><a href="${x.url}" target="_blank" rel="noopener">Open official source ↗</a></div>`).join("");frame("Trusted source library","Primary sources first. Check the source date before using changing facts.",`<div class="panel">${items}</div><div class="note">NCERT textbooks are copyrighted. Lakshya links to official access points and will not reproduce or redistribute textbook files without permission.</div>`,"Sources");return}
if(tab==="Progress"){let s=summary(),last=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=d.toLocaleDateString("en-CA");return {d:d.toLocaleDateString("en-IN",{weekday:"short"}),v:state.tests.filter(x=>x.date===key).reduce((a,x)=>a+x.score,0)}}),mx=Math.max(1,...last.map(x=>x.v));frame("Your progress","Consistency, accuracy and learning history.",`<div class="stats"><div class="stat"><b>${s.n}</b><small>Tests</small></div><div class="stat"><b>${s.acc}%</b><small>Accuracy</small></div><div class="stat"><b>${s.avg}</b><small>Average score</small></div></div><h2>Last seven days · net score</h2><div class="chart">${last.map(x=>`<div><i style="height:${Math.max(4,x.v/mx*100)}px"></i><small>${x.d}</small><small>${x.v?x.v.toFixed(0):"–"}</small></div>`).join("")}</div><h2>Recent tests</h2>${state.tests.slice().reverse().slice(0,8).map(x=>`<article class="entry"><b>${esc(x.subject)}</b><strong>${x.score.toFixed(2)}/30</strong><small>${x.date} · ${x.c} correct · ${x.w} wrong · ${x.s} skipped</small><button class="outline" onclick="review('${x.id}')">Open review</button></article>`).join("")||"<p class='muted'>No completed tests yet.</p>"}<div class="note">Progress is stored in this browser/device. Export or cloud backup is not yet available. Avoid clearing browser data until backup is added.</div>`,"Progress");return}}
function subject(name){let s=SYLLABUS.find(x=>x.name===name);let pack=BANK[name]?"<span class='tag green'>Practice pack available</span>":"<span class='tag gold'>Question bank under verification</span>";let chapters=s.chapters.map((c,i)=>`<div class="listitem"><div class="row"><b>${esc(c)}</b>${i===0&&BANK[name]?pack:""}</div>${name==="History"||name==="Science & Technology"?(i===0?`<p class="muted">The existing 30-question set is a broad subject practice pack, not yet tagged chapter-by-chapter.</p>`:""):`<p class="muted">Questions will be released after checking against official papers and reliable references.</p>`}</div>`).join("");frame(name,"Syllabus coverage and question-bank status.",`<div class="panel"><span class="tag">Prelims syllabus</span><span class="tag gold">High difficulty target</span>${chapters}${BANK[name]?`<button class="cta" style="width:100%;margin-top:14px" onclick="start('${esc(name)}')">Attempt 30-question practice set</button>`:"<p class='note'>No quiz is enabled here yet. We are deliberately not filling this section with unverified questions.</p>"}</div>`,"Prelims")}
function writeAnswer(i){let p=MAINS[i],key="mains-"+i,val=state.notes[key]||"";frame(p.name,"Personal answer-writing workspace.",`<div class="panel"><p class="muted">${p.detail}</p><label for="answer"><b>Your answer / outline</b></label><textarea id="answer" placeholder="Write your introduction, main arguments, examples and conclusion...">${esc(val)}</textarea><button class="cta" onclick="saveAnswer(${i})">Save my draft</button><p class="muted">Saved locally on this device. No automatic marks are assigned.</p></div>`,"Mains")}
function saveAnswer(i){state.notes["mains-"+i]=$("#answer").value;save();alert("Draft saved on this device.");go("Mains")}
function start(subject){state.active={id:String(Date.now()),subject,ans:{},i:0};save();question()}
function question(){let a=state.active,arr=BANK[a.subject],q=arr[a.i],n=a.i+1;root.innerHTML=`<header><button class="secondary" style="float:right" onclick="go('Prelims')">Exit</button><small>${esc(a.subject.toUpperCase())} · PRACTICE BANK</small><h2>Question ${n} / ${arr.length}</h2><div class="track"><i style="width:${n/arr.length*100}%"></i></div></header><main><span class="tag gold">AI-assisted practice · Not a verified PYQ</span><div class="qbox"><h3>${esc(q[0])}</h3>${q[1].map((o,j)=>`<button class="option ${a.ans[a.i]===j?"sel":""}" onclick="pick(${j})"><b>${letters[j]}</b>${esc(o)}</button>`).join("")}</div><div class="actions"><button class="secondary" onclick="move(-1)" ${a.i===0?"disabled":""}>Previous</button><button class="secondary" onclick="skip()">Skip</button><button class="cta" onclick="${n===arr.length?"finish()":"move(1)"}">${n===arr.length?"Submit":"Next"}</button></div><small>${Object.keys(a.ans).length} answered · +1 correct · −⅓ incorrect · 0 skipped</small></main>`}
function pick(j){state.active.ans[state.active.i]=j;save();question()}
function move(d){let max=BANK[state.active.subject].length-1;state.active.i=Math.max(0,Math.min(max,state.active.i+d));save();question()}
function skip(){delete state.active.ans[state.active.i];if(state.active.i<BANK[state.active.subject].length-1)state.active.i++;save();question()}
function finish(){let a=state.active,arr=BANK[a.subject],c=0,w=0,s=0,rev=arr.map((q,i)=>{let v=a.ans[i];if(v===undefined)s++;else if(v===q[2])c++;else w++;return {i,v:v===undefined?null:v,correct:q[2]}}),r={id:a.id,subject:a.subject,date:new Date().toLocaleDateString("en-CA"),c,w,s,a:c+w,score:c-w/3,rev};state.tests.push(r);state.active=null;save();review(r.id)}
function review(id){let r=state.tests.find(x=>x.id===id);if(!r)return;let body=`<section class="result"><small>FINAL SCORE</small><b>${r.score.toFixed(2)} / ${r.rev.length}</b><small>${r.c} correct · ${r.w} incorrect · ${r.s} skipped</small></section>`+r.rev.map((v,k)=>{let q=BANK[r.subject][v.i],ok=v.v===v.correct,skip=v.v===null;return `<article class="review"><b>Q${k+1}. ${esc(q[0])}</b><small class="${skip?"skip":ok?"good":"bad"}">${skip?"Skipped":ok?"Correct":"Incorrect"}</small>${q[1].map((o,j)=>`<p class="${j===v.correct?"good":v.v===j&&!ok?"bad":""}">${letters[j]}. ${esc(o)} ${j===v.correct?"✓":v.v===j&&!ok?"← Your answer":""}</p>`).join("")}<p><b>Your answer:</b> ${skip?"Skipped":letters[v.v]} · <b>Correct:</b> ${letters[v.correct]}</p><p><b>Explanation:</b> ${esc(q[3])}</p><span class="tag gold">AI-assisted practice · Not a verified PYQ</span></article>`}).join("");frame("Detailed review",r.subject+" · "+r.date,body,"Progress")}
if(!state.name)login();else go("Home");
window.addEventListener("load",()=>{if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{})});
</script></body></html>
